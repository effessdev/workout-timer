<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Timer</title>

    <style>
      /* Light Mode (Default) */
      :root {
        --bg: #f3f4f6;
        --surface: #ffffff;
        --surface-hover: #f9fafb;
        --border: #e5e7eb;
        --text-main: #111827;
        --text-muted: #6b7280;
        --accent: #4f46e5;
        --accent-glow: rgba(79, 70, 229, 0.2);
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }

      /* Dark Mode (Automatic) */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --surface: #1e293b;
          --surface-hover: #2dd4bf11; /* subtle tint */
          --border: #334155;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --accent: #2dd4bf;
          --accent-glow: rgba(45, 212, 191, 0.2);
          --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
      }

      .container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      /* Page Load Stagger Animation */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container > * {
        animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }

      .settings {
        animation-delay: 0.05s;
      }
      .grid {
        animation-delay: 0.12s;
      }
      .display-area {
        animation-delay: 0.19s;
      }
      .controls {
        animation-delay: 0.26s;
      }

      /* Settings UI */
      .settings {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        background: var(--surface);
        padding: 12px 24px;
        border-radius: 100px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        width: fit-content;
        margin: 0 auto;
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.2s ease;
      }

      .settings:hover {
        border-color: var(--text-muted);
      }

      .settings label {
        font-size: 1rem;
        font-weight: 500;
        color: var(--text-muted);
        transition: color 0.3s ease;
      }

      .input-wrapper {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .settings input {
        width: 60px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text-main);
        text-align: center;
        font-size: 1.1rem;
        font-weight: 600;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .settings input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .settings span {
        font-size: 1rem;
        color: var(--text-muted);
      }

      /* Grid UI */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      @media (min-width: 520px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .timer {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 16px;
        min-height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          background-color 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
        box-shadow: var(--shadow);
        user-select: none;
      }

      .timer:hover {
        transform: translateY(-4px) scale(1.02);
        background: var(--surface-hover);
        border-color: var(--text-muted);
      }

      .timer:active {
        transform: translateY(1px) scale(0.98);
      }

      /* Running Timer Pulse Animation */
      @keyframes pulseGlow {
        0% {
          box-shadow:
            0 0 0 0px var(--accent-glow),
            var(--shadow);
        }
        50% {
          box-shadow:
            0 0 0 8px var(--accent-glow),
            var(--shadow);
        }
        100% {
          box-shadow:
            0 0 0 0px var(--accent-glow),
            var(--shadow);
        }
      }

      .timer.running {
        border-color: var(--accent);
        background: var(--surface);
        animation: pulseGlow 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      }

      .timer h2 {
        font-size: 2.8rem;
        font-weight: 700;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 6px;
        transition: transform 0.2s ease;
      }

      .timer:hover h2 {
        transform: scale(1.05);
      }

      .timer h2 span {
        font-size: 1.2rem;
        font-weight: 500;
        color: var(--text-muted);
      }

      /* Status Display */
      .display-area {
        background: var(--surface);
        border-radius: 24px;
        border: 1px solid var(--border);
        padding: 40px 20px;
        text-align: center;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 220px;
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease,
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      #message {
        font-size: 1.2rem;
        font-weight: 500;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 8px;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      #message.pop {
        animation: messagePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes messagePop {
        0% {
          opacity: 0;
          transform: translateY(-8px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      #countdown {
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--text-main);
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s ease;
      }

      #countdown.tick {
        animation: tickPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes tickPop {
        0% {
          transform: scale(0.7);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Celebration Pop for Finished State */
      .display-area.finished {
        animation: celebrate 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes celebrate {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
          border-color: var(--accent);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Controls */
      .controls {
        display: flex;
        justify-content: center;
        height: 60px;
      }

      button {
        padding: 0 40px;
        height: 60px;
        width: 100%;
        max-width: 280px;
        border: none;
        border-radius: 100px;
        cursor: pointer;
        background: var(--danger);
        color: white;
        font-size: 1.2rem;
        font-weight: 600;
        box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.25s ease,
          visibility 0.25s ease,
          background-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      button:hover {
        background: var(--danger-hover);
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 6px 12px rgba(239, 68, 68, 0.3);
      }

      button:active {
        transform: translateY(1px) scale(0.98);
      }

      /* Smooth display toggle for cancel button */
      .hidden {
        display: block !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        transform: translateY(10px) scale(0.92) !important;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="settings">
        <label>Start Delay</label>
        <div class="input-wrapper">
          <input id="delayInput" type="number" value="5" min="0" />
          <span>sec</span>
        </div>
      </div>

      <div class="grid">
        <div class="timer" data-time="15">
          <h2>15<span>s</span></h2>
        </div>
        <div class="timer" data-time="30">
          <h2>30<span>s</span></h2>
        </div>
        <div class="timer" data-time="45">
          <h2>45<span>s</span></h2>
        </div>
        <div class="timer" data-time="60">
          <h2>60<span>s</span></h2>
        </div>
      </div>

      <div class="display-area" id="displayArea">
        <div id="message">Ready</div>
        <div id="countdown"></div>
      </div>

      <div class="controls">
        <button id="cancel" class="hidden">Cancel</button>
      </div>
    </div>

    <script>
      const message = document.getElementById("message");
      const countdown = document.getElementById("countdown");
      const cancelBtn = document.getElementById("cancel");
      const delayInput = document.getElementById("delayInput");
      const displayArea = document.getElementById("displayArea");

      let timeout = null;
      let interval = null;
      let running = false;
      let currentCard = null;
      let audioCtx = null;

      // Animated text state updates
      function setMessage(text) {
        if (message.textContent === text) return;
        message.textContent = text;
        message.classList.remove("pop");
        void message.offsetWidth; // Force reflow to re-trigger animation
        message.classList.add("pop");
      }

      function setCountdown(text) {
        countdown.textContent = text;
        countdown.classList.remove("tick");
        void countdown.offsetWidth; // Force reflow to re-trigger animation
        if (text !== "") {
          countdown.classList.add("tick");
        }
      }

      // Restore saved delay from LocalStorage
      const savedDelay = localStorage.getItem("workoutTimerDelay");
      if (savedDelay !== null) {
        delayInput.value = savedDelay;
      }

      // Save delay to LocalStorage on change
      delayInput.addEventListener("input", () => {
        localStorage.setItem("workoutTimerDelay", delayInput.value);
      });

      function getAudioContext() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }

      function playWhistleBurst(delayOffset, duration) {
        const ctx = getAudioContext();
        const now = ctx.currentTime + delayOffset;

        const limiter = ctx.createDynamicsCompressor();
        limiter.threshold.setValueAtTime(-2, now);
        limiter.ratio.setValueAtTime(15, now);
        limiter.attack.setValueAtTime(0.003, now);
        limiter.connect(ctx.destination);

        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.type = "sine";
        lfo.frequency.setValueAtTime(22, now);
        lfoGain.gain.setValueAtTime(0.35, now);
        lfo.connect(lfoGain);
        lfo.start(now);
        lfo.stop(now + duration);

        [2250, 2320].forEach((freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq * 0.9, now);
          osc.frequency.linearRampToValueAtTime(freq, now + 0.04);

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.5, now + 0.03);
          gain.gain.setValueAtTime(0.5, now + duration - 0.04);
          gain.gain.linearRampToValueAtTime(0.0001, now + duration);

          osc.connect(gain);
          lfoGain.connect(gain.gain);
          gain.connect(limiter);

          osc.start(now);
          osc.stop(now + duration);
        });
      }

      function startSound() {
        playWhistleBurst(0, 0.15);
        playWhistleBurst(0.22, 0.45);
      }

      function clearEverything() {
        clearTimeout(timeout);
        clearInterval(interval);
        running = false;
        cancelBtn.classList.add("hidden");
        if (currentCard) currentCard.classList.remove("running");
        currentCard = null;
        setCountdown("");
      }

      function cancel() {
        clearEverything();
        setMessage("Ready");
      }

      cancelBtn.onclick = cancel;

      document.querySelectorAll(".timer").forEach((card) => {
        card.onclick = () => {
          // If a timer is already running, clear it first
          if (running) {
            clearEverything();
          }

          running = true;
          currentCard = card;
          card.classList.add("running");
          cancelBtn.classList.remove("hidden");

          const delay = Math.max(0, Number(delayInput.value) || 0);
          let remain = delay;

          setMessage("Starting In");
          setCountdown(remain);

          interval = setInterval(() => {
            remain--;
            if (remain > 0) {
              setCountdown(remain);
            }
          }, 1000);

          timeout = setTimeout(() => {
            clearInterval(interval);
            startSound();

            let left = Number(card.dataset.time);
            setMessage("Workout!");
            setCountdown(left);

            interval = setInterval(() => {
              left--;
              setCountdown(left);

              if (left <= 0) {
                clearInterval(interval);

                // Reusing whistle sound for finish
                startSound();

                setMessage("Finished");
                setCountdown("");

                // Trigger celebration bounce animation
                displayArea.classList.remove("finished");
                void displayArea.offsetWidth;
                displayArea.classList.add("finished");

                running = false;
                card.classList.remove("running");
                cancelBtn.classList.add("hidden");
              }
            }, 1000);
          }, delay * 1000);
        };
      });
    </script>
  </body>
</html>
