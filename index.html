<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Timer</title>

    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --card-hover: #334155;
        --accent: #38bdf8;
        --accent2: #22c55e;
        --danger: #ef4444;
        --text: #f8fafc;
        --muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          Inter,
          Segoe UI,
          Arial,
          sans-serif;
      }

      body {
        background: linear-gradient(135deg, #020617, #111827);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .container {
        width: min(900px, 100%);
      }

      h1 {
        text-align: center;
        font-size: 2.4rem;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin-bottom: 35px;
      }

      .settings {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
      }

      .settings input {
        width: 80px;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: #1e293b;
        color: white;
        text-align: center;
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 20px;
      }

      .timer {
        background: var(--card);
        border-radius: 18px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: 0.25s;
        user-select: none;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .timer:hover {
        transform: translateY(-4px);
        background: var(--card-hover);
      }

      .timer.running {
        outline: 3px solid var(--accent);
      }

      .timer h2 {
        font-size: 2.6rem;
      }

      .timer p {
        margin-top: 10px;
        color: var(--muted);
      }

      .status {
        margin-top: 35px;
        text-align: center;
        font-size: 1.1rem;
        min-height: 30px;
      }

      .big {
        font-size: 4rem;
        margin-top: 10px;
        font-weight: bold;
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-top: 30px;
      }

      button {
        padding: 14px 28px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: var(--danger);
        color: white;
        font-size: 1rem;
        transition: 0.2s;
      }

      button:hover {
        filter: brightness(1.1);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🏋 Workout Timer</h1>
      <div class="subtitle">Click any timer to begin.</div>

      <div class="settings">
        <label>Start Delay</label>
        <input id="delayInput" type="number" value="3" min="0" />
        <span>seconds</span>
      </div>

      <div class="grid">
        <div class="timer" data-time="15">
          <h2>15</h2>
          <p>seconds</p>
        </div>

        <div class="timer" data-time="30">
          <h2>30</h2>
          <p>seconds</p>
        </div>

        <div class="timer" data-time="45">
          <h2>45</h2>
          <p>seconds</p>
        </div>

        <div class="timer" data-time="60">
          <h2>60</h2>
          <p>seconds</p>
        </div>
      </div>

      <div class="status">
        <div id="message">Ready</div>
        <div id="countdown" class="big"></div>
      </div>

      <div class="controls">
        <button id="cancel" class="hidden">Cancel Timer</button>
      </div>
    </div>

    <script>
      const message = document.getElementById("message");
      const countdown = document.getElementById("countdown");
      const cancelBtn = document.getElementById("cancel");
      const delayInput = document.getElementById("delayInput");

      let timeout = null;
      let interval = null;
      let running = false;
      let currentCard = null;
      let audioCtx = null;

      /* 
  Studio-Grade Audio Engine
  Uses physical acoustic synthesis & an anti-clipping limiter to generate
  real-world gym acoustics (Pea Whistle & Boxing Bell) without distortion.
*/
      function getAudioContext() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }

      /* 
  Physical Model: Pea Whistle
  Simulates a resonant whistle chamber with a rapidly spinning pea interrupting
  the airflow (~22 Hz amplitude modulation) and an air-pressure pitch bend.
*/
      function playWhistleBurst(delayOffset, duration) {
        const ctx = getAudioContext();
        const now = ctx.currentTime + delayOffset;

        // Brickwall Limiter: Maximizes loudness while preventing digital clipping/distortion
        const limiter = ctx.createDynamicsCompressor();
        limiter.threshold.setValueAtTime(-2, now);
        limiter.ratio.setValueAtTime(15, now);
        limiter.attack.setValueAtTime(0.003, now);
        limiter.connect(ctx.destination);

        // LFO (Low Frequency Oscillator) to simulate the spinning pea fluttering the air
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.type = "sine";
        lfo.frequency.setValueAtTime(22, now); // ~22 pea flutters per second
        lfoGain.gain.setValueAtTime(0.35, now);
        lfo.connect(lfoGain);
        lfo.start(now);
        lfo.stop(now + duration);

        // Twin acoustic chamber tones for a rich, hollow whistle sound
        [2250, 2320].forEach((freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "triangle"; // Smooth, airy acoustic pipe waveform

          // Air pressure pitch bend: pitch rises slightly as breath hits the chamber
          osc.frequency.setValueAtTime(freq * 0.9, now);
          osc.frequency.linearRampToValueAtTime(freq, now + 0.04);

          // Volume envelope
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.5, now + 0.03);
          gain.gain.setValueAtTime(0.5, now + duration - 0.04);
          gain.gain.linearRampToValueAtTime(0.0001, now + duration);

          osc.connect(gain);
          lfoGain.connect(gain.gain); // Apply the spinning pea flutter to the volume
          gain.connect(limiter);

          osc.start(now);
          osc.stop(now + duration);
        });
      }

      function startSound() {
        // A classic referee/trainer start: one short chirp followed by a commanding blow
        playWhistleBurst(0, 0.15);
        playWhistleBurst(0.22, 0.45);
      }

      /* 
  Physical Model: Gym / Boxing Bell
  Simulates a bronze/steel gong struck by a mallet. Stacking inharmonic partials
  (non-integer frequency ratios) creates authentic metallic resonance and ring-out.
*/
      function playBellStrike(delayOffset = 0) {
        const ctx = getAudioContext();
        const now = ctx.currentTime + delayOffset;

        // Brickwall Limiter to ensure maximum punch without speaker distortion
        const limiter = ctx.createDynamicsCompressor();
        limiter.threshold.setValueAtTime(-2, now);
        limiter.ratio.setValueAtTime(15, now);
        limiter.attack.setValueAtTime(0.002, now);
        limiter.connect(ctx.destination);

        const fundamental = 520;
        // Inharmonic modal ratios for real metal acoustics
        const partials = [
          { ratio: 1.0, decay: 1.8, vol: 0.6 }, // Deep body resonance
          { ratio: 1.34, decay: 1.3, vol: 0.45 }, // Metallic overtone 1
          { ratio: 1.89, decay: 0.9, vol: 0.35 }, // Metallic overtone 2
          { ratio: 2.76, decay: 0.6, vol: 0.25 }, // Metallic overtone 3
          { ratio: 4.12, decay: 0.35, vol: 0.2 }, // High metallic sheen
          { ratio: 6.03, decay: 0.12, vol: 0.3 }, // Initial hammer strike clink
        ];

        partials.forEach((p) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(fundamental * p.ratio, now);

          // Sharp strike attack, followed by a smooth natural metallic decay
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(p.vol, now + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);

          osc.connect(gain);
          gain.connect(limiter);

          osc.start(now);
          osc.stop(now + p.decay);
        });
      }

      function finishSound() {
        // Classic 3-bell gym/boxing round finish (Ding! Ding! Ding!)
        playBellStrike(0);
        playBellStrike(0.25);
        playBellStrike(0.5);
      }

      function clearEverything() {
        clearTimeout(timeout);
        clearInterval(interval);
        running = false;
        cancelBtn.classList.add("hidden");
        if (currentCard) currentCard.classList.remove("running");
        currentCard = null;
        countdown.textContent = "";
      }

      function cancel() {
        clearEverything();
        message.textContent = "Cancelled";
      }

      cancelBtn.onclick = cancel;

      document.querySelectorAll(".timer").forEach((card) => {
        card.onclick = () => {
          if (running) return;
          running = true;
          currentCard = card;
          card.classList.add("running");
          cancelBtn.classList.remove("hidden");

          const delay = Math.max(0, Number(delayInput.value) || 0);
          let remain = delay;

          message.textContent = "Starting...";
          countdown.textContent = remain;

          interval = setInterval(() => {
            remain--;
            if (remain > 0) countdown.textContent = remain;
          }, 1000);

          timeout = setTimeout(() => {
            clearInterval(interval);
            startSound();

            let left = Number(card.dataset.time);
            message.textContent = "Workout!";
            countdown.textContent = left;

            interval = setInterval(() => {
              left--;
              countdown.textContent = left;

              if (left <= 0) {
                clearInterval(interval);
                finishSound();
                message.textContent = "Finished 🎉";
                countdown.textContent = "";
                running = false;
                card.classList.remove("running");
                cancelBtn.classList.add("hidden");
              }
            }, 1000);
          }, delay * 1000);
        };
      });
    </script>
  </body>
</html>
